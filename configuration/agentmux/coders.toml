format-version = 1

[[coders]]
id = 'claude'

    [coders.tmux]
    initial-command = 'claude'
    resume-command = 'claude --resume {{coder-session-id}}'
    prompt-regex = '(?ms)^[─-]{20,}\s+[>❯]\s+[─-]{20,}'
    prompt-inspect-lines = 6
    prompt-idle-column = 2

[[coders]]
id = 'codex'

    [coders.tmux]
    initial-command = 'codex'
    resume-command = 'codex resume {{coder-session-id}}'
    prompt-regex = '(?ms)^›.*\n\s*\n.*$'
    prompt-inspect-lines = 3
    prompt-idle-column = 2

[[coders]]
id = 'muse'

    [coders.tmux]
    initial-command = "cistella conduct --profile muse --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- muse --yolo"
    resume-command = "cistella conduct --profile muse --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- muse --yolo resume {{coder-session-id}}"
    # Frame: ─── divider, ❯ input row (cursor idles in column 3 when empty),
    # ─── divider, two-space-indented model/context info row. The compose-text
    # guard is delegated to prompt-idle-column (cursor check below), not the
    # regex. Fixes issues/relay/58 defect 2: the prior strict regex
    # required a blank ┃ line above the info row, which false-negatived on
    # sidebar-wrapping layouts (api@agentmux-aux wraps its working-directory
    # path into the input area). pty@c145365 into eb146fa, 2026-07-30.
    prompt-regex = '(?m)^─{20,}\n❯.*\n─{20,}\n\s{2}\S.*$'
    prompt-inspect-lines = 5
    prompt-idle-column = 2

[[coders]]
id = 'opencode'

    [coders.tmux]
    initial-command = "cistella conduct --profile opencode --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone"
    resume-command = "cistella conduct --profile opencode --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone --session {{coder-session-id}}"
    prompt-regex = '(?m)^.*┃.*\n\s*╹▀{20,}\s*\n\s+.*\bctrl\+p commands'
    prompt-inspect-lines = 10
    prompt-idle-column = 5

[[coders]]

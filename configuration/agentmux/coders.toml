format-version = 1

# TODO: Rename profiles.
#       'claude' -> 'claude-tmux'
#       'codex' -> 'codex-tmux'
# TODO: Add support for profile class which can be passed
#       as an argument to Cistella to simplify Cistella profile
#       management. E.g., `profile-class = 'opencode'` could be
#       used as `--extension {{profile-class}}` to tell Cistella
#       which extension to load for supporting a particular
#       agent harness.

[[coders]]
id = 'claude'

    [coders.tmux]
    initial-command = 'claude'
    resume-command = 'claude --resume {{coder-session-id}}'
    prompt-regex = '(?ms)^[─-]{20,}\s+[>❯]\s+[─-]{20,}'
    prompt-inspect-lines = 6
    prompt-idle-column = 2

[[coders]]
id = 'codex'

    [coders.tmux]
    initial-command = 'codex'
    resume-command = 'codex resume {{coder-session-id}}'
    prompt-regex = '(?ms)^›.*\n\s*\n.*$'
    prompt-inspect-lines = 3
    prompt-idle-column = 2

[[coders]]
id = 'muse'

    [coders.tmux]
    initial-command = 'muse --disable-sandbox --approval-judge off --approval-mode untrusted'
    resume-command = 'muse resume --disable-sandbox --approval-judge off --approval-mode untrusted {{coder-session-id}}'
    # Frame: ─── divider, ❯ input row (cursor idles in column 3 when empty),
    # ─── divider, two-space-indented model/context info row. The compose-text
    # guard is delegated to prompt-idle-column, as with opencode.
    prompt-regex = '(?m)^─{20,}\n❯.*\n─{20,}\n\s{2}\S.*$'
    prompt-inspect-lines = 5
    prompt-idle-column = 2

[[coders]]
id = 'cistella-muse'

    [coders.tmux]
    initial-command = "cistella conduct --profile muse --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- muse --yolo"
    resume-command = "cistella conduct --profile muse --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- muse --yolo resume {{coder-session-id}}"
    prompt-regex = '(?m)^─{20,}\n❯.*\n─{20,}\n\s{2}\S.*$'
    prompt-inspect-lines = 5
    prompt-idle-column = 2

[[coders]]
id = 'opencode'

    [coders.tmux]
    initial-command = 'opencode --standalone'
    resume-command = 'opencode --standalone --session {{coder-session-id}}'
    # Matches frame structure only; the "user has pending compose text"
    # guard is delegated to prompt-idle-column (cursor check below), not
    # the regex. Fixes issues/relay/58 defect 2: the prior strict regex
    # required a blank ┃ line above the info row, which false-negatived on
    # sidebar-wrapping layouts (api@agentmux-aux wraps its working-directory
    # path into the input area). pty@c145365 into eb146fa, 2026-07-30.
    prompt-regex = '(?m)^.*┃.*\n\s*╹▀{20,}\s*\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+\s*)?\s*$'
    # Prior (pty@3fe6fb8 into eb146fa, corrected 2026-07-30 per
    # issues/tmux/2's second resolution). Kept for revert:
    #prompt-regex = '(?m)^\s*┃\s*\n(?:\s*┃\s*\n)*\s*┃.*\n\s*╹▀{20,}\s*\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+\s*)?\s*$'
    # Prior (regressed 322bf80 shape; required the last ┃ line to be
    # non-empty, so a composing draft matched as ready). Kept for revert:
    #prompt-regex = '(?ms)^\s*┃.*\n(?:\s*┃.*\n)*\s*┃\s+\S.*\n\s*╹▀{20,}\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+)?$'
    prompt-inspect-lines = 10
    prompt-idle-column = 5

[[coders]]
id = 'opencode-acp'

    [coders.acp]
    channel = 'stdio'
    command = 'opencode acp'

[[coders]]
id = 'cistella-opencode'

    [coders.tmux]
    initial-command = "cistella conduct --profile opencode --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone"
    resume-command = "cistella conduct --profile opencode --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone --session {{coder-session-id}}"
    prompt-regex = '(?m)^.*┃.*\n\s*╹▀{20,}\s*\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+\s*)?\s*$'
    prompt-inspect-lines = 10
    prompt-idle-column = 5

[[coders]]
id = 'cistella-coordinator-opencode'

    [coders.tmux]
    initial-command = "cistella conduct --profile coordinator --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone"
    resume-command = "cistella conduct --profile coordinator --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone --session {{coder-session-id}}"
    prompt-regex = '(?m)^.*┃.*\n\s*╹▀{20,}\s*\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+\s*)?\s*$'
    prompt-inspect-lines = 10
    prompt-idle-column = 5

[[coders]]
id = 'cistella-maintainer-opencode'

    [coders.tmux]
    initial-command = "cargo run --quiet -- conduct --profile cistella-maintainer --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone"
    resume-command = "cargo run --quiet -- conduct --profile cistella-maintainer --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone --session {{coder-session-id}}"
    prompt-regex = '(?m)^.*┃.*\n\s*╹▀{20,}\s*\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+\s*)?\s*$'
    prompt-inspect-lines = 10
    prompt-idle-column = 5

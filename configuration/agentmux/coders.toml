    resume-command = "cargo run --quiet -- conduct --profile opencode--cistella-maintainer --project-name {{project-name}} --label agentmux.session={{bundle-session-id}} --supplement bundle-name={{bundle-name}} --session-directory {{session-directory}}:{{session-directory}} -- opencode --auto --standalone --session {{coder-session-id}}"

# Cistella Maintainer: Privileged seat for Cistella development

image = 'cistella/opencode:local'
credential-surface = { ssh_agent = '/run/user/1000/keyring/ssh' }
container-home = '{{environment:HOME}}'
command = ['opencode']
environment-acceptances = [
  'AGENTMUX_BUNDLE',
  'AGENTMUX_SESSION',
]

[isolator]
name = 'podman'

[[extensions]]
name = 'landlock'

[environment-assignments]
AGENTMUX_CONFIGURATION_DIRECTORY = '{{core:container-home}}/.config/agentmux'
BUN_TMPDIR = '/tmp/scratch'
CARGO_HOME = '{{core:container-home}}/.cargo'
EDITOR = 'nano'
GH_CONFIG_DIR = '{{core:container-home}}/.config/gh'
PATH = '{{core:container-home}}/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
TMPDIR = '/tmp/scratch'
TMUX = '{{core:container-home}}/.local/state/agentmux/bundles/{{supplement:bundle-name}}/tmux.sock,0,0'

## Container State (in-container taxonomy)

[[mounts]]
host-source = '~/.config/cistella/in-container'
container-target = '{{core:container-home}}/.config'
mode = 'rw'

[[mounts]]
host-source = '~/.local/share/cistella/in-container'
container-target = '{{core:container-home}}/.local/share'
mode = 'rw'

[[mounts]]
host-source = '~/.local/state/cistella/in-container'
container-target = '{{core:container-home}}/.local/state'
mode = 'rw'

[[mounts]]
host-source = '~/.cache/cistella/in-container'
container-target = '{{core:container-home}}/.cache'
mode = 'rw'

## Cistella Namespace (privileged seats only)

[[mounts]]
host-source = '~/.config/cistella'
container-target = '{{core:container-home}}/.config/cistella'
mode = 'rw'

[[mounts]]
host-source = '~/.local/share/cistella'
container-target = '{{core:container-home}}/.local/share/cistella'
mode = 'rw'

[[mounts]]
host-source = '~/.cache/cistella'
container-target = '{{core:container-home}}/.cache/cistella'
mode = 'rw'

## Tool State (home-level, outside standard ~/type)

[[mounts]]
host-source = '~/.cargo'
container-target = '{{core:container-home}}/.cargo'
mode = 'rw'

[[mounts]]
host-source = '~/.npm'
container-target = '{{core:container-home}}/.npm'
mode = 'rw'

[[mounts]]
host-source = '~/.rustup'
container-target = '{{core:container-home}}/.rustup'
mode = 'ro'

## Agentmux (shared host config/state)

[[mounts]]
host-source = '~/.config/agentmux'
container-target = '{{core:container-home}}/.config/agentmux'
mode = 'ro'

[[mounts]]
host-source = '~/.local/state/agentmux'
container-target = '{{core:container-home}}/.local/state/agentmux'
mode = 'rw'

## Harness (shared host config/state)

[[mounts]]
host-source = '~/.config/opencode'
container-target = '{{core:container-home}}/.config/opencode'
mode = 'ro'

[[mounts]]
host-source = '~/.local/share/opencode'
container-target = '{{core:container-home}}/.local/share/opencode'
mode = 'rw'

[[mounts]]
host-source = '~/.local/state/opencode'
container-target = '{{core:container-home}}/.local/state/opencode'
mode = 'rw'

## Third-Party Configurations

[[mounts]]
host-source = '~/.gitconfig'
container-target = '{{core:container-home}}/.gitconfig'
mode = 'ro'

[[mounts]]
host-source = '~/.nbrc'
container-target = '{{core:container-home}}/.nbrc'
mode = 'ro'

[[mounts]]
host-source = '~/.ssh'
container-target = '{{core:container-home}}/.ssh'
mode = 'ro'

## Collections

[[mounts]]
host-source = '~/src'
container-target = '{{core:container-home}}/src'
mode = 'ro'

# TODO(temporary): understand exactly what nb writes at the root and
# re-split into RO parent + RW project triple once known.
[[mounts]]
host-source = '~/Dropbox/Notes'
container-target = '{{core:container-home}}/Dropbox/Notes'
mode = 'rw'
